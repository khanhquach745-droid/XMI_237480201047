<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 8: Xóa nhân viên 001</title>
</head>
<body>
    <h2>Kết quả xóa phần tử XML</h2>
    <div id="output"></div>

    <script>
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                myFunction(this);
            }
        };
        xhttp.open("GET", "danhsachnhanvien.xml", true);
        xhttp.send();

        function myFunction(xml) {
            var xmlDoc = xml.responseXML;
            var root = xmlDoc.documentElement;
            var manvList = xmlDoc.getElementsByTagName("manv");
            var thongBao = "Không tìm thấy mã 001";

            for (var i = 0; i < manvList.length; i++) {
                if (manvList[i].childNodes[0].nodeValue.trim() == "001") {
                    var nhanVienCanXoa = manvList[i].parentNode;
                    root.removeChild(nhanVienCanXoa);
                    thongBao = "Đã xóa thành công nhân viên mã 001 khỏi cây DOM!";
                    break;
                }
            }
            document.getElementById("output").innerHTML = thongBao;
        }
    </script>
</body>
</html>
