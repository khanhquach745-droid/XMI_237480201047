<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 5: Lấy thuộc tính category của sách</title>
</head>
<body>
    <h2>Danh sách category của từng cuốn sách</h2>
    <div id="output"></div>

    <script>
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                myFunction(this);
            }
        };
        xhttp.open("GET", "books.xml", true);
        xhttp.send();

        function myFunction(xml) {
            var xmlDoc = xml.responseXML;
            var books = xmlDoc.getElementsByTagName("book");
            var txt = "";
            for (var i = 0; i < books.length; i++) {
                var title = books[i].getElementsByTagName("title")[0].textContent;
                var category = books[i].getAttribute("category");
                txt += "Sách: " + title + " - Thuộc tính category: " + category + "<br>";
            }
            document.getElementById("output").innerHTML = txt;
        }
    </script>
</body>
</html>
