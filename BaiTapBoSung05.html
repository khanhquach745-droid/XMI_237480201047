<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 5</title>
</head>
<body>

<h2>Bài 5: Thuộc tính category của các book</h2>

<button onclick="docCategory()">Hiển thị</button>

<div id="result"></div>

<script>
function docCategory() {

    let xhr = new XMLHttpRequest();

    xhr.open("GET", "books.xml", true);

    xhr.onload = function () {

        if (xhr.status == 200) {

            let xmlDoc = xhr.responseXML;

            let books = xmlDoc.getElementsByTagName("book");

            let result = "<ul>";

            for (let i = 0; i < books.length; i++) {

                // Lấy thuộc tính category
                let category = books[i].getAttribute("category");

                let title = books[i]
                    .getElementsByTagName("title")[0]
                    .textContent;

                result +=
                    "<li>" +
                    title +
                    " - category: " +
                    category +
                    "</li>";
            }

            result += "</ul>";

            document.getElementById("result").innerHTML = result;
        }
    };

    xhr.send();
}
</script>

</body>
</html>
